{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <h2>Create an Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Register</button>
    </form>
{% endblock %}
