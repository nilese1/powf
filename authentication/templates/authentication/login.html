{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <h2>Login</h2>
    {% if form.errors %}<p style="color: red;">Invalid username or password.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
    <a href="{% url 'authentication:register' %}"><button>Create Account</button></a>
{% endblock %}
